name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Generate icon
        run: npm run icon

      - name: Download and verify binaries
        run: npm run binaries

      - name: Build installer, portable zip, SBOM and checksums
        run: npm run build

      - name: Generate release notes
        run: npm run release:notes

      - name: Collect release subjects
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath release -File | Where-Object {
            $_.Name -like 'Vela-*' -or $_.Name -in @('bom.json', 'SHA256SUMS.txt')
          } | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw 'No release artifacts found' }
          "SUBJECTS<<__VELA_EOF__" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          $files | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "__VELA_EOF__" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          $files | ForEach-Object { Write-Host $_ }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.SUBJECTS }}

      - name: Create GitHub release
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/Vela-*.exe \
            release/*.zip \
            release/bom.json \
            release/SHA256SUMS.txt \
            release/RELEASE_NOTES.md \
            --repo "$GITHUB_REPOSITORY" \
            --title "Vela ${GITHUB_REF_NAME#v}" \
            --notes-file release/RELEASE_NOTES.md \
            --verify-tag \
            --latest
